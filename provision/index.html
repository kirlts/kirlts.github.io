<script>
(function () {
  const f = document.getElementById('abrir-guia');
  const b64 = (id) => Uint8Array.from(atob(document.getElementById(id).textContent.trim()), (c) => c.charCodeAt(0));
  f.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const boton = f.querySelector('button'), error = document.getElementById('abrir-error');
    boton.disabled = true; boton.textContent = 'Abriendo…'; error.hidden = true;
    try {
      const d = new age.Decrypter(); d.addPassphrase(f.clave.value);
      const llave = (await d.decrypt(b64('llave-cifrada'), 'text')).split('\n').find((l) => l.startsWith('AGE-SECRET-KEY-'));
      const d2 = new age.Decrypter(); d2.addIdentity(llave);
      document.getElementById('principal').innerHTML = await d2.decrypt(b64('guia-cifrada'), 'text');
      document.body.classList.remove('pagina-acceso');
      document.getElementById('principal').classList.remove('acceso');
      document.getElementById('barra-guia').hidden = false;
      window.scrollTo(0, 0);
      if (window.provisionPasos) window.provisionPasos();
    } catch (x) {
      error.textContent = /identity|passphrase|scrypt|mac|header/i.test(String(x)) ? 'Contraseña incorrecta.' : 'No se pudo abrir: ' + x;
      error.hidden = false; boton.disabled = false; boton.textContent = 'Abrir guía'; f.clave.select();
    }
  });
  // Cambio de vista (Restaurar, Guía completa, Manual) sin salir de la página ni volver a pedir la contraseña.
  document.addEventListener('click', (ev) => {
    const a = ev.target.closest('[data-ir]');
    if (!a) return;
    ev.preventDefault();
    document.querySelectorAll('.vista').forEach((v) => { v.hidden = v.dataset.vista !== a.dataset.ir; });
    document.querySelectorAll('[data-ir]').forEach((b) => { if (b === a) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    window.scrollTo(0, 0);
  });
})();
</script>
